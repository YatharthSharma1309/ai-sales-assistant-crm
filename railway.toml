# Railway native deploy (Nixpacks — no Docker)
# Create a service from this repo root; add a PostgreSQL plugin and link DATABASE_URL.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build:api"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"

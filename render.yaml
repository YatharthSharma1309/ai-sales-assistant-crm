# Optional: deploy on Render instead of Railway (also no Docker).
# Dashboard: New → Blueprint → connect this repo.
# Or create Web Service + PostgreSQL manually and match these settings.

services:
  - type: web
    name: crm-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: TRUST_PROXY
        value: "1"
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        sync: false
      - key: INBOUND_EMAIL_WEBHOOK_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false

databases:
  - name: crm-db
    plan: free
    databaseName: crm
    user: crm
